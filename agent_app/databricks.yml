bundle:
  name: agent_langgraph

resources:
  # Lakebase Postgres instance used as the LangGraph checkpointer
  # (durable state for the deterministic state machine + async HIL flow).
  database_instances:
    agent_memory:
      name: banking-agent-memory
      capacity: CU_1

  # MLflow experiment for agent tracing - automatically created by bundle
  experiments:
    agent_langgraph_experiment:
      name: /Users/${workspace.current_user.userName}/${bundle.name}-${bundle.target}

  apps:
    agent_langgraph:
      name: "${bundle.target}-agent-langgraph"
      description: "LangGraph agent application"
      source_code_path: ./

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "${resources.experiments.agent_langgraph_experiment.id}"
            permission: 'CAN_MANAGE'
        - name: 'database'
          database:
            instance_name: ${resources.database_instances.agent_memory.name}
            database_name: 'databricks_postgres'
            permission: 'CAN_CONNECT_AND_CREATE'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph:
          name: agent-langgraph
